<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" fill="none">
  <defs>
    <linearGradient id="core" x1="450" y1="250" x2="790" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08B9FF"/>
      <stop offset="0.55" stop-color="#285BFF"/>
      <stop offset="1" stop-color="#8B35FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="470" y1="300" x2="760" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36E4FF"/>
      <stop offset="0.55" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#B14CFF"/>
    </linearGradient>
    <linearGradient id="hand" x1="470" y1="680" x2="970" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9C91"/>
      <stop offset="0.55" stop-color="#FFB39C"/>
      <stop offset="1" stop-color="#FFCFAD"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="180" y1="760" x2="540" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09265D"/>
      <stop offset="1" stop-color="#1761C9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- atmospheric glow only; no background rectangle -->
  <circle cx="620" cy="390" r="250" fill="#087BFF" opacity=".10" filter="url(#softGlow)"/>
  <circle cx="620" cy="390" r="185" stroke="#1498FF" stroke-width="5" opacity=".30" filter="url(#glow)"/>

  <!-- dotted orbital connector -->
  <path d="M400 245 C500 110 750 105 870 245 C950 340 930 510 800 585 C680 655 500 635 395 535 C300 445 315 335 400 245Z"
        stroke="url(#ring)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 17" opacity=".9"/>

  <!-- central radial connectors -->
  <g stroke="url(#ring)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <path d="M620 250V205"/>
    <path d="M620 575V640"/>
    <path d="M445 390H385"/>
    <path d="M795 390H855"/>
    <path d="M490 275L450 235"/>
    <path d="M750 275L790 235"/>
    <path d="M490 505L450 545"/>
    <path d="M750 505L790 545"/>
  </g>

  <!-- central rings -->
  <circle cx="620" cy="390" r="145" stroke="url(#ring)" stroke-width="7" opacity=".75"/>
  <circle cx="620" cy="390" r="125" stroke="#48D7FF" stroke-width="4" opacity=".9"/>
  <circle cx="620" cy="390" r="112" fill="url(#core)" stroke="#D7F7FF" stroke-width="3" filter="url(#glow)"/>

  <!-- central code icon -->
  <g stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M585 355L548 390L585 425"/>
    <path d="M655 355L692 390L655 425"/>
    <path d="M635 348L605 432"/>
  </g>
  <text x="620" y="475" text-anchor="middle" fill="#fff"
        font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">IT SOLUTIONS</text>

  <!-- top cloud -->
  <g transform="translate(620 145)">
    <circle r="54" fill="#1559C8" stroke="#2FCBFF" stroke-width="4"/>
    <path d="M-29 14h58a17 17 0 0 0 0-34h-4a28 28 0 0 0-52 5h-2a15 15 0 0 0 0 29Z"
          stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-7 2v25M-17 17l10 10 10-10" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- top left settings -->
  <g transform="translate(455 215)">
    <circle r="54" fill="#1559C8" stroke="#2FCBFF" stroke-width="4"/>
    <circle r="15" stroke="#fff" stroke-width="5"/>
    <path d="M0-34v12M0 22v12M-34 0h12M22 0h12M-24-24l9 9M15 15l9 9M24-24l-9 9M-15 15l-9 9"
          stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- top right server -->
  <g transform="translate(785 215)">
    <circle r="54" fill="#3425B9" stroke="#7E55FF" stroke-width="4"/>
    <g stroke="#fff" stroke-width="5" stroke-linejoin="round">
      <rect x="-25" y="-27" width="50" height="18" rx="3"/>
      <rect x="-25" y="-5" width="50" height="18" rx="3"/>
      <rect x="-25" y="17" width="50" height="18" rx="3"/>
    </g>
    <g fill="#fff"><circle cx="-15" cy="-18" r="2.5"/><circle cx="-15" cy="4" r="2.5"/><circle cx="-15" cy="26" r="2.5"/></g>
  </g>

  <!-- left web -->
  <g transform="translate(405 390)">
    <circle r="66" fill="#087FDE" stroke="#46DFFF" stroke-width="5"/>
    <rect x="-35" y="-30" width="70" height="60" rx="7" stroke="#fff" stroke-width="5"/>
    <path d="M-35-13H35" stroke="#fff" stroke-width="5"/>
    <circle cx="-25" cy="-22" r="3" fill="#fff"/><circle cx="-15" cy="-22" r="3" fill="#fff"/>
    <circle cx="5" cy="8" r="18" stroke="#fff" stroke-width="4"/>
    <path d="M-13 8h36M5-10c7 7 7 29 0 36M5-10c-7 7-7 29 0 36" stroke="#fff" stroke-width="3"/>
  </g>
  <text x="405" y="470" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">WEB</text>
  <text x="405" y="493" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DEVELOPMENT</text>

  <!-- right mobile -->
  <g transform="translate(835 390)">
    <circle r="66" fill="#4B20C8" stroke="#B050FF" stroke-width="5"/>
    <rect x="-20" y="-36" width="40" height="72" rx="6" stroke="#fff" stroke-width="5"/>
    <path d="M-7-26H7M-6 27H6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="835" y="470" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">MOBILE</text>
  <text x="835" y="493" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DEVELOPMENT</text>

  <!-- lower left users -->
  <g transform="translate(455 555)">
    <circle r="54" fill="#145FC8" stroke="#35CFFF" stroke-width="4"/>
    <circle cx="0" cy="-13" r="11" stroke="#fff" stroke-width="4"/>
    <path d="M-24 20c1-20 47-20 48 0M-23 5c-17-11-28 1-28 14M23 5c17-11 28 1 28 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- lower right design -->
  <g transform="translate(785 555)">
    <circle r="54" fill="#4B20C8" stroke="#A64EFF" stroke-width="4"/>
    <path d="M-15 28L-25 10L-4-25L18-32L27-12L5 25Z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-4-25l22 13M-8 2l10 10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- lower security -->
  <g transform="translate(620 650)">
    <circle r="54" fill="#1468C9" stroke="#39D6FF" stroke-width="4"/>
    <path d="M0-27L27-17V4c0 18-13 30-27 38C-14 34-27 22-27 4v-21Z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-11 3l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
